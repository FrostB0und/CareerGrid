<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <style>
        :root {
            --primary: #0066cc;
            --primary-dark: #004499;
            --secondary: #00d9ff;
            --neutral-50: #f8f9fa;
            --neutral-100: #e9ecef;
            --neutral-200: #dee2e6;
            --text-primary: #1a1d20;
            --text-secondary: #495057;
            --border-radius: 0.5rem;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--neutral-50);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 40px;
        }

        .header {
            margin-bottom: 40px;
            text-align: center;
        }

        .header h1 {
            color: var(--text-primary);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--neutral-200);
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
            outline: none;
        }

        textarea {
            min-height: 120px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 40px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secondary {
            background: #eee;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 42px;
            font-weight: 700;
            margin: auto;
        }

        .avatar-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .success-message {
            display: none;
            background: #d1fae5;
            color: #065f46;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="card">

        <div class="header">
            <h1>Edit Profile</h1>
            <p>Update your profile information</p>
        </div>

        <div id="successMessage" class="success-message">
            ✓ Profile updated successfully!
        </div>

        <form method="post">
            {% csrf_token %}

            <!-- Avatar -->
            <div class="avatar-section">
                <div class="avatar">
                    {{ user.first_name|first|default:"U"|upper }}
                </div>
            </div>

            <!-- Names -->
            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="first_name"
                           value="{{ user.first_name }}"
                           placeholder="Enter your first name">
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="last_name"
                           value="{{ user.last_name }}"
                           placeholder="Enter your last name">
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email"
                       value="{{ user.email }}"
                       placeholder="your.email@example.com">
            </div>

            <!-- Bio -->
            <div class="form-group">
                <label>Bio</label>
                <textarea name="bio"
                          placeholder="Tell us about yourself...">{{ profile.bio }}</textarea>
            </div>

            <!-- Location -->
            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location"
                       value="{{ profile.location }}"
                       placeholder="City, Country">
            </div>

            <!-- Website -->
            <div class="form-group">
                <label>Website</label>
                <input type="url" name="website"
                       value="{{ profile.website }}"
                       placeholder="https://yourwebsite.com">
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="phone"
                       value="{{ profile.phone }}"
                       placeholder="+1 123 456 789">
            </div>

            <!-- Buttons -->
            <div class="form-actions">
                <button type="reset" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>

        </form>
    </div>
</div>

<script>
    document.querySelector('form').addEventListener('submit', function () {
        const msg = document.getElementById('successMessage');
        msg.classList.add('show');
        setTimeout(() => msg.classList.remove('show'), 3000);
    });
</script>

</body>
</html>

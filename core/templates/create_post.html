<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post</title>

    <style>
        :root {
            --primary: #0066cc;
            --primary-dark: #004499;
            --neutral-50: #f8f9fa;
            --neutral-100: #e9ecef;
            --neutral-200: #dee2e6;
            --text-primary: #1a1d20;
            --text-secondary: #495057;
            --border-radius: 0.5rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--neutral-50);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: var(--text-primary);
        }

        .header p {
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: var(--border-radius);
            border: 1px solid var(--neutral-200);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 1px solid var(--neutral-200);
            border-radius: 8px;
            font-size: 16px;
            resize: none;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: var(--primary);
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Create Post</h1>
        <p>Share something with your network</p>
    </div>

    <div class="card">

        <form method="post">
            {% csrf_token %}

            <label for="content">What's on your mind?</label>

            <textarea
                name="content"
                id="content"
                placeholder="Write your post here..."
                required
            ></textarea>

            <button type="submit" class="btn">
                Post
            </button>

        </form>

        <a href="/" class="back">← Back to Feed</a>

    </div>

</div>

</body>
</html>
